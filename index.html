<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111d63"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Family Jeopardy</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:white;background:#090e30}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}main{max-width:1050px;margin:auto}h1{text-align:center;color:#ffce4a;letter-spacing:2px;margin:14px 0;text-shadow:2px 3px #000}h2{text-align:center}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:12px;background:#f7ce48;color:#10183b;font-weight:800}button:disabled{opacity:.35;cursor:default}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:15px}.team{background:#142979;border:1px solid #5368c0;border-radius:10px;padding:8px;text-align:center}.team input{background:#fff;color:#10183b;width:100%;border:0;border-radius:5px;padding:7px;text-align:center;font-size:14px}.team strong{display:block;font-size:clamp(18px,3vw,32px);margin:6px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.category{min-height:68px;display:grid;place-items:center;background:#172b88;text-align:center;padding:3px;font-weight:900;font-size:clamp(10px,2.1vw,19px);word-break:break-word}.cell{width:100%;height:clamp(53px,11vw,85px);background:#172b88;border-radius:0;color:#ffd452;font-size:clamp(16px,3.4vw,29px);padding:0;text-shadow:1px 2px #151515}.cell.used{background:#14204c;color:#14204c}.status{text-align:center;color:#c9d1ff;margin:12px}.panel{position:fixed;inset:0;z-index:4;background:#070c28ed;display:flex;align-items:center;justify-content:center;padding:12px}.dialog{background:#162c82;border:3px solid #b1bff9;border-radius:15px;max-width:750px;width:100%;padding:18px;text-align:center;max-height:94vh;overflow:auto}.dialog h2{font-size:clamp(22px,4vw,39px);line-height:1.3;margin:24px 0}.dialog p{font-size:18px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.actions button{font-size:clamp(11px,2.3vw,16px);padding:10px 4px}.wrong{background:#ff9c9c}.secondary{background:#e1e6fa}.hide{display:none}.footer{display:flex;justify-content:space-around;gap:8px;margin:16px 0;flex-wrap:wrap}.footer button{background:#d7e0fc}.wager{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center;margin:10px 0}.wager input{width:100%;padding:10px;border-radius:5px;border:0}.sub{font-size:12px;color:#cbd3ff;text-align:center} @media(max-width:540px){.category{min-height:60px}.scores{gap:4px}.team{padding:4px}.dialog{padding:12px}.actions{gap:4px}}
</style></head><body><main><h1>🏆 FAMILY JEOPARDY!</h1><div class="scores" id="scores"></div><div class="board" id="board"></div><p id="status" class="status">Choose a dollar amount to begin!</p><div class="footer"><button onclick="startFinal()">Final Jeopardy</button><button onclick="resetGame()">New Game</button></div><p class="sub">Space · History · Sports · Science · Caterpillars | 3 teams | 25 clues</p></main><div id="modal" class="panel hide"><div class="dialog" id="dialog"></div></div><script>
const cats=['🚀 Space','🏛️ History','🏒 Sports','🔬 Science','🐛 Caterpillars'];
const questions=[
[['This planet is called the Red Planet.','What is Mars?'],['This is the largest planet in our solar system.','What is Jupiter?'],['This force keeps planets in orbit around the Sun.','What is gravity?'],['This is the name of our galaxy.','What is the Milky Way?'],['This planet has the hottest average surface temperature.','What is Venus?']],
[['This famous ship sank in 1912.','What is the Titanic?'],['This civilization built the Giza pyramids.','Who were the ancient Egyptians?'],['This wall separated parts of Berlin until 1989.','What is the Berlin Wall?'],['This Canadian was the first Canadian woman in space.','Who is Roberta Bondar?'],['World War II ended in this year.','What is 1945?']],
[['This sport uses a puck on ice.','What is hockey?'],['This basketball star is called King James.','Who is LeBron James?'],['This country won the 2010 Olympic men’s hockey gold medal.','What is Canada?'],['This is how many players, including a goalie, each hockey team normally has on the ice.','What is six?'],['This NHL legend recorded 2,857 regular-season points.','Who is Wayne Gretzky?']],
[['This is the chemical formula for water.','What is H₂O?'],['Humans need this gas to breathe.','What is oxygen?'],['This organ pumps blood through your body.','What is the heart?'],['Plants use this process to make food from sunlight.','What is photosynthesis?'],['This is the chemical symbol for gold.','What is Au?']],
[['Caterpillars grow into these two kinds of insects.','What are butterflies and moths?'],['Many caterpillars feed on these parts of plants.','What are leaves?'],['Caterpillars have this many true legs.','What is six?'],['Some moth caterpillars spin cocoons from this material.','What is silk?'],['These fleshy structures help caterpillars grip branches, but are not true legs.','What are prolegs?']]
];
let state;try{state=JSON.parse(localStorage.getItem('family-jeopardy-state'))}catch(e){}state=state||{names:['Team 1','Team 2','Team 3'],scores:[0,0,0],used:[],final:false};let current=null,shown=false;
function save(){localStorage.setItem('family-jeopardy-state',JSON.stringify(state))}
function money(n){return (n<0?'−':'')+'$'+Math.abs(n)}
function render(){document.getElementById('scores').innerHTML=state.names.map((n,i)=>`<div class="team"><input aria-label="Team ${i+1} name" value="${esc(n)}" oninput="setName(${i},this.value)"><strong>${money(state.scores[i])}</strong></div>`).join('');let html=cats.map(n=>`<div class="category">${n}</div>`).join('');for(let r=0;r<5;r++)for(let c=0;c<5;c++){const key=c+'-'+r,used=state.used.includes(key);html+=`<button class="cell ${used?'used':''}" ${used?'disabled':''} onclick="openClue(${c},${r})">${used?'':('$'+((r+1)*100))}</button>`}document.getElementById('board').innerHTML=html;document.getElementById('status').textContent=state.used.length===25?'All clues completed — play Final Jeopardy!':`${state.used.length} of 25 clues played`}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setName(i,v){state.names[i]=v;save()}
function openClue(c,r){current={c,r};shown=false;showClue()}
function showClue(){let {c,r}=current,pts=(r+1)*100;document.getElementById('dialog').innerHTML=`<div class="top"><strong>${cats[c]} — $${pts}</strong><button class="secondary" onclick="closeModal()">✕</button></div><h2>${questions[c][r][shown?1:0]}</h2>${shown?`<p>Who answered correctly? Tap a team to award points. Use minus if a team gave a wrong answer.</p><div class="actions">${state.names.map((n,i)=>`<button onclick="award(${i},${pts},true)">+${pts}<br>${esc(n)}</button>`).join('')}</div><div class="actions">${state.names.map((n,i)=>`<button class="wrong" onclick="award(${i},-${pts},false)">−${pts}<br>${esc(n)}</button>`).join('')}</div><button class="secondary" onclick="finishClue()">Skip / No correct answer</button>`:`<button onclick="shown=true;showClue()">Reveal Answer</button>`}`;document.getElementById('modal').classList.remove('hide')}
function award(i,v,finish){state.scores[i]+=v;save();render();if(finish)finishClue();else showClue()}
function finishClue(){const key=current.c+'-'+current.r;if(!state.used.includes(key))state.used.push(key);save();render();closeModal()}
function closeModal(){document.getElementById('modal').classList.add('hide')}
function resetGame(){if(!confirm('Start a new game and reset all scores?'))return;state={names:state.names,scores:[0,0,0],used:[],final:false};save();render();closeModal()}
let finalShown=false;
function startFinal(){finalShown=false;showFinal()}
function showFinal(){document.getElementById('modal').classList.remove('hide');document.getElementById('dialog').innerHTML=`<div class="top"><strong>🏆 FINAL JEOPARDY — Space Exploration</strong><button class="secondary" onclick="closeModal()">✕</button></div><h2>${finalShown?'Who is Neil Armstrong?':'In 1969, this astronaut became the first human to walk on the Moon.'}</h2><button onclick="finalShown=!finalShown;showFinal()">${finalShown?'Hide':'Reveal'} Answer</button><p>Enter each team's wager, then choose correct (+) or wrong (−).</p>${state.names.map((n,i)=>`<div class="wager"><label>${esc(n)}<br>${money(state.scores[i])}</label><input id="w${i}" type="number" min="0" max="${Math.max(0,state.scores[i])}" value="0"><div><button onclick="finalAward(${i},1)">✓</button> <button class="wrong" onclick="finalAward(${i},-1)">✕</button></div></div>`).join('')}<p class="sub">Wagers can be up to a team's positive score. Each team should only be scored once.</p><button class="secondary" onclick="closeModal()">Return to Board</button>`}
function finalAward(i,sign){let input=document.getElementById('w'+i),amount=Number(input.value);if(!Number.isFinite(amount)||amount<0||amount>Math.max(0,state.scores[i])){alert('Enter a valid wager up to the team score.');return}state.scores[i]+=sign*amount;save();render();showFinal()}
render();
</script></body></html>
